<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="job_portal.css">
</head>
<body>
    <div class="box">
        <div class="rect">
            <div class="heading">
                <h1>Job Application  
                    <h3>(Web)</h3>
                  </h1>
            </div>

                        <!-- agar tum for me first name likhoge to jaise hi uspar click karoge 
                           waise hi show hoga cursor in placeholder -->
            <form action="">
            <div class="form_container">
                <div class="form_controls">
                    <label for="first_name"> First Name</label>
                 <input type="text" 
                   id="first_name"
                   name="first_name"
                   placeholder="Enter your first_name.."
                   required /> 
                </div>

                <div class="form_controls">
                    <label for="last_name"> Last Name</label>
                 <input type="text" 
                   id="last_name"
                   name="last_name"
                   placeholder="Enter your first_name.."
                   required /> 
                </div>

                <div class="form_controls">
                    <label for="Email"> E-mail</label>
                 <input type="email" 
                   id="Email"
                   name="Email"
                   placeholder="Enter your E-mail "
                   required /> 
                </div>

                <div class="form_controls">
                    <label for="Job Role"> Job Role</label>
                 <select name="job_role" id="job_role">
                 <option value="">Select Job Role</option>
                 <option value="Frontend">Frontend Developer</option>
                 <option value="Backend">Backend Developer</option>
                 <option value="full stack">Full Stack Developer</option>
                 <option value="ui_ux">UI UX Designer</option>
                 </select>
                </div>

                <div class="Add_area">
                <label for="Address"> Address</label>
                 <textarea name="Address" id="Address"
                 rows="5"
                 cols="50">
                </textarea>
                </div>

                 <div class="form_controls">
                    <label for="city"> City</label>
                 <input type="city" 
                   id="city"
                   name="city"
                   placeholder="Enter your city"
                   required /> 
                </div>


                 <div class="form_controls">
                <label for="pincode"> Pincode</label>
                <input type="number" 
                   id="pincode"
                   name="pincode"
                   placeholder="enter pincode"
                   required /> 
                </div>

                <div class="form_controls">
                <label for="date">Date</label>
                <input value="2026-03-29" type="date" 
                   id="date"
                   name="date"
                   required /> 
                </div>


                 <div class="form_controls">
                <label for=""> Upload your CV</label>
                <input type="file" 
                   id="upload"
                   name="upload"
                   required /> 
                </div>

                   
                

            </div>
           </form>

           <div class="button_container">
            <button type="submit">Apply Now</button>
            
        </div>


        </div>

       
    </div>
    
</body>
</html>
